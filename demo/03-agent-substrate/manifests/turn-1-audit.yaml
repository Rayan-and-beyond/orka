# Turn 1: an Actor on Agent Substrate, not a Pod. The class substrate-session
# keeps only data on detach; the process is gone. Write intent: Orka's
# Publisher publishes the audit as a branch (no pull request yet).
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: audit-write
  namespace: orka-system
  labels:
    demo.orka.ai/name: 03-agent-substrate
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: SESSION_NAME
    create: true
  execution:
    workspace:
      classRef:
        name: substrate-session
      reusePolicy: session
  workspace:
    intent: write
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
    publicationGitRepo: https://github.com/sozercan/orka-demo-inventory
    publicationReadCredentialRef:
      name: github-credentials
    publicationCredentialRef:
      name: github-credentials
    pushBranch: orka/security-audit
  timeout: 20m
  prompt: |
    Audit this repository for input validation gaps in the HTTP handlers.
    Write your findings to AUDIT.md in the repository root, at most twelve
    lines, one finding per line with the file and function. Do not change any
    other file. Reply with the exact contents of AUDIT.md.
