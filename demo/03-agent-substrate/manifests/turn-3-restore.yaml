# Turn 3: a new Task, restored from the checkpoint. The original workspace
# and its Actors are gone; the bytes come back. No repository is cloned here:
# the checkpoint is the workspace.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: audit-restore
  namespace: orka-system
  labels:
    demo.orka.ai/name: 03-agent-substrate
spec:
  type: agent
  agentRef:
    name: codex-coder
  execution:
    workspace:
      classRef:
        name: substrate-session
      onDetach: Delete
      restoreFrom:
        name: audit-checkpoint
        uid: CHECKPOINT_UID
        digest: CHECKPOINT_DIGEST
  timeout: 20m
  prompt: |
    Run: pwd; ls; cat AUDIT.md. Reply with the exact combined output and
    nothing else.
