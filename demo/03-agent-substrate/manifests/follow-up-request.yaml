# The follow-up request. It names the same Session, so a fresh Actor boots
# from the kept data and finds AUDIT.md still on disk, even though the Actor
# that wrote it is gone. A Session keeps one runtime profile, so the workspace
# settings are repeated verbatim; the prompt only reads, and an unchanged tree
# publishes nothing.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: audit-follow-up
  namespace: orka-system
  labels:
    demo.orka.ai/name: 03-agent-substrate
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: SESSION_NAME
  execution:
    workspace:
      classRef:
        name: substrate-session
      reusePolicy: session
  workspace:
    intent: write
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
    publicationGitRepo: https://github.com/sozercan/orka-demo-inventory
    publicationReadCredentialRef:
      name: github-credentials
    publicationCredentialRef:
      name: github-credentials
    pushBranch: orka/security-audit
  timeout: 20m
  prompt: |
    Do not change any file. Run: pwd; ls; cat AUDIT.md. Reply with the exact
    combined output.
