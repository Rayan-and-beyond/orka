# Turn 2: same Session. A fresh Actor boots from the kept data; AUDIT.md is
# still there even though the process that wrote it no longer exists.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: audit-continue
  namespace: orka-system
  labels:
    demo.orka.ai/name: 03-agent-substrate
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: inventory-audit
  execution:
    workspace:
      classRef:
        name: substrate-session
      reusePolicy: session
  workspace:
    intent: read
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
  timeout: 20m
  prompt: |
    Print AUDIT.md from the repository root exactly as it is on disk, then
    append one line to it: "reviewed: yes". Reply with the file's new contents.
