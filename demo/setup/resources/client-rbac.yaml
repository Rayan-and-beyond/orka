# The identity a developer or CI job uses. It is an ordinary ServiceAccount;
# `kubectl create token orka-client` mints the bearer token the CLI, the
# dashboard, and Claude Code present to Orka. No model key is involved.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orka-client
  namespace: orka-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orka-client
  namespace: orka-system
rules:
  - apiGroups: [core.orka.ai]
    resources: [tasks, repositorymonitors, repositoryscans]
    verbs: [get, list, watch, create, update, patch, delete]
  # Sessions are store-backed, not CRDs; the API still authorizes them
  # against this virtual resource. Deleting a Session archives it and lets
  # the Tasks bound to it finish their own deletion.
  - apiGroups: [core.orka.ai]
    resources: [sessions]
    verbs: [get, list, delete]
  - apiGroups: [core.orka.ai]
    resources: [agents, tools, skills, providers, runtimepools]
    verbs: [get, list, watch]
  # Using an execution-workspace class is a permission of its own: admission
  # checks that the caller may "use" the class a Task names.
  - apiGroups: [workspace.orka.ai]
    resources: [executionworkspaceclasses, executionworkspacecheckpoints]
    verbs: [get, list, watch, use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orka-client
  namespace: orka-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orka-client
subjects:
  - kind: ServiceAccount
    name: orka-client
    namespace: orka-system
