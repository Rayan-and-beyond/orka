# Turn 2: the same Session, so the same suspended Sandbox wakes up with the
# implementation still on disk. A Session keeps one runtime profile, so this
# turn carries the same write-intent publication settings; the prompt asks
# for verification only, and an unchanged tree publishes nothing.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: inventory-verify
  namespace: orka-system
  labels:
    demo.orka.ai/name: 02-agent-sandbox
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: SESSION_NAME
  execution:
    workspace:
      classRef:
        name: sandbox-session
      reusePolicy: session
  workspace:
    intent: write
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
    publicationGitRepo: https://github.com/sozercan/orka-demo-inventory
    publicationReadCredentialRef:
      name: github-credentials
    publicationCredentialRef:
      name: github-credentials
    forgeCredentialRef:
      name: github-credentials
    pushBranch: orka/healthz-from-sandbox
    prBaseBranch: main
    createPR: true
  timeout: 20m
  prompt: |
    Do not change any file. Run: ls; grep -n -i healthz main.go main_test.go
    README.md. Reply with the exact combined output.
