# Turn 2: the same Session, so the same suspended Sandbox wakes up with the
# implementation still on disk. Read intent: Orka refuses the turn if the
# repository tree changes, which is the point of a verification pass.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: inventory-verify
  namespace: orka-system
  labels:
    demo.orka.ai/name: 02-agent-sandbox
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: inventory-sandbox
  execution:
    workspace:
      classRef:
        name: sandbox-session
      reusePolicy: session
  workspace:
    intent: read
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
  timeout: 20m
  prompt: |
    Do not change any file. Run: ls; grep -n healthz main.go README.md;
    go test ./... -run Healthz -v. Reply with the exact combined output.
