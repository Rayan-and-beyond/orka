# Turn 1: implement the change inside a kubernetes-sigs Agent Sandbox.
# The Task names a class, not a provider: sandbox-session means "one Sandbox
# per Session, keep its data when the agent detaches". Write intent means
# Orka's Publisher verifies the tree, publishes the branch, and opens the PR.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: inventory-implement
  namespace: orka-system
  labels:
    demo.orka.ai/name: 02-agent-sandbox
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: SESSION_NAME
    create: true
  execution:
    workspace:
      classRef:
        name: sandbox-session
      reusePolicy: session
  workspace:
    intent: write
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
    publicationGitRepo: https://github.com/sozercan/orka-demo-inventory
    publicationReadCredentialRef:
      name: github-credentials
    publicationCredentialRef:
      name: github-credentials
    forgeCredentialRef:
      name: github-credentials
    pushBranch: orka/healthz-from-sandbox
    prBaseBranch: main
    createPR: true
  timeout: 30m
  prompt: |
    Add a GET /healthz endpoint that returns HTTP 200 with the JSON body
    {"status":"ok"}. Add a unit test for it in the existing style and add the
    endpoint to the API table in README.md. This runtime has no Go toolchain,
    so do not try to build or test; CI runs the tests on the pull request.
    Reply with a short summary and the list of files you changed.
